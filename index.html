<!DOCTYPE html>
<!--
  TICKET DESK — single-file helpdesk (GitHub / Cloudflare Workers ready)

  DEPLOY: Replace your repo's index.html with this file, commit, and let
  Cloudflare redeploy. No build step needed — React loads from CDN and
  tickets persist in the browser's localStorage.

  NOTE: localStorage is per-browser, per-device. Tickets logged in the
  Claude artifact version do NOT carry over, and tickets logged on your
  desktop won't appear on your phone. For shared/team data, the next step
  is the SharePoint or Worker-KV backend.

  OPTIONAL, AI TRIAGE: The "AI triage" button posts to /api/triage.
  To enable it, add a Cloudflare Worker route with this code and run:
    wrangler secret put ANTHROPIC_API_KEY

  export default {
    async fetch(request, env) {
      const url = new URL(request.url);
      if (url.pathname === "/api/triage" && request.method === "POST") {
        const t = await request.json();
        const CATEGORIES = ["Hardware","Software","Network","Accounts & Access","Email / M365","Printing","Other"];
        const PRIORITIES = ["Critical","High","Medium","Low"];
        const prompt = "You are an IT helpdesk triage assistant. Analyze this ticket and respond with ONLY a raw JSON object, no markdown fences, no preamble. Keys: " +
          '"category" (exactly one of ' + JSON.stringify(CATEGORIES) + '), ' +
          '"priority" (exactly one of ' + JSON.stringify(PRIORITIES) + '), ' +
          '"reasoning" (one short sentence), ' +
          '"firstResponse" (a professional 2-4 sentence first reply to the requester).' +
          "\n\nSubject: " + (t.subject || "") +
          "\nDescription: " + (t.description || "(none)") +
          "\nCurrent category: " + (t.category || "") +
          "\nCurrent priority: " + (t.priority || "");
        const r = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "x-api-key": env.ANTHROPIC_API_KEY,
            "anthropic-version": "2023-06-01"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 1000,
            messages: [{ role: "user", content: prompt }]
          })
        });
        const data = await r.json();
        const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
        return new Response(text.replace(/```json|```/g, "").trim(), {
          headers: { "content-type": "application/json" }
        });
      }
      return env.ASSETS.fetch(request);
    }
  }
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ticket Desk — Internal Helpdesk</title>
<style>
  body { margin: 0; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script>
// ---------- storage shim: same async API as the Claude artifact, backed by localStorage ----------
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("Key not found: " + key);
    return { key: key, value: v };
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      return { key: key, value: value };
    } catch (e) {
      return null; // e.g. storage full / blocked
    }
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key: key, deleted: true };
  },
};
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- constants ----------
const STORAGE_KEY = "helpdesk-data-v1";

const CATEGORIES = ["Hardware", "Software", "Network", "Accounts & Access", "Email / M365", "Printing", "Other"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const SLA_HOURS = { Critical: 4, High: 24, Medium: 72, Low: 120 }; // resolution targets
const STATUSES = ["Open", "In Progress", "On Hold", "Resolved"];
const DEFAULT_TECHNICIANS = ["Njua", "Tech 2", "Tech 3"]; // starting roster — editable in the Team view

const PRIORITY_COLOR = {
  Critical: "#C0392B",
  High: "#E67E22",
  Medium: "#2980B9",
  Low: "#7F8C8D",
};

const STATUS_STYLE = {
  Open: { bg: "#EAF3FB", fg: "#1F5C8B" },
  "In Progress": { bg: "#FDF3E3", fg: "#9A6008" },
  "On Hold": { bg: "#F0EDF7", fg: "#5B4A8A" },
  Resolved: { bg: "#E7F4EF", fg: "#0E7C66" },
};

const mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
const sans = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

// ---------- helpers ----------
const ticketKey = (n) => "TKT-" + String(n).padStart(4, "0");

function dueAt(t) {
  return new Date(new Date(t.createdAt).getTime() + (SLA_HOURS[t.priority] || 72) * 3600000);
}

function isOverdue(t) {
  return t.status !== "Resolved" && Date.now() > dueAt(t).getTime();
}

function dueLabel(t) {
  if (t.status === "Resolved") return null;
  const diff = dueAt(t).getTime() - Date.now();
  const abs = Math.abs(diff);
  const h = abs / 3600000;
  const span = h < 1 ? Math.max(1, Math.round(abs / 60000)) + "m" : h < 48 ? Math.round(h) + "h" : Math.round(h / 24) + "d";
  return diff >= 0 ? "due in " + span : "overdue " + span;
}

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  return d + "d ago";
}

function fmtDate(iso) {
  return new Date(iso).toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
  });
}

// ---------- small components ----------
function StatusPill({ status }) {
  const s = STATUS_STYLE[status] || STATUS_STYLE.Open;
  return (
    <span style={{
      background: s.bg, color: s.fg, fontFamily: mono, fontSize: 11,
      padding: "3px 8px", borderRadius: 4, fontWeight: 600, letterSpacing: 0.3,
      whiteSpace: "nowrap",
    }}>
      {status.toUpperCase()}
    </span>
  );
}

function PriorityDot({ priority }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, color: "#3D4852" }}>
      <span style={{
        width: 8, height: 8, borderRadius: 2, background: PRIORITY_COLOR[priority],
        display: "inline-block",
      }} />
      {priority}
    </span>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "block", marginBottom: 14 }}>
      <div style={{
        fontFamily: mono, fontSize: 11, letterSpacing: 0.8, color: "#5B6770",
        marginBottom: 5, textTransform: "uppercase",
      }}>{label}</div>
      {children}
    </label>
  );
}

const inputStyle = {
  width: "100%", boxSizing: "border-box", padding: "9px 11px",
  border: "1px solid #CBD4DA", borderRadius: 6, fontSize: 14,
  fontFamily: sans, background: "#fff", color: "#16212B", outline: "none",
};

// ---------- main app ----------
function HelpdeskApp() {
  const [tickets, setTickets] = useState([]);
  const [nextId, setNextId] = useState(1);
  const [technicians, setTechnicians] = useState(DEFAULT_TECHNICIANS);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);

  const [view, setView] = useState("list"); // list | new | detail | team | reports
  const [selectedId, setSelectedId] = useState(null);

  const [statusFilter, setStatusFilter] = useState("Active");
  const [priorityFilter, setPriorityFilter] = useState("All");
  const [search, setSearch] = useState("");

  // load
  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get(STORAGE_KEY);
        if (result && result.value) {
          const data = JSON.parse(result.value);
          setTickets(data.tickets || []);
          setNextId(data.nextId || 1);
          setTechnicians(data.technicians && data.technicians.length ? data.technicians : DEFAULT_TECHNICIANS);
        }
      } catch (e) {
        // no data yet — fresh start
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  async function persist(patch) {
    const next = {
      tickets: patch.tickets !== undefined ? patch.tickets : tickets,
      nextId: patch.nextId !== undefined ? patch.nextId : nextId,
      technicians: patch.technicians !== undefined ? patch.technicians : technicians,
    };
    setTickets(next.tickets);
    setNextId(next.nextId);
    setTechnicians(next.technicians);
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(next));
      setSaveError(!res);
    } catch (e) {
      setSaveError(true);
    }
  }

  function addTechnician(name) {
    const n = name.trim();
    if (!n || n === "Unassigned") return;
    if (technicians.some((t) => t.toLowerCase() === n.toLowerCase())) return;
    persist({ technicians: [...technicians, n] });
  }

  function removeTechnician(name) {
    persist({ technicians: technicians.filter((t) => t !== name) });
  }

  function createTicket(form) {
    const now = new Date().toISOString();
    const t = {
      id: nextId,
      key: ticketKey(nextId),
      subject: form.subject.trim(),
      description: form.description.trim(),
      requester: form.requester.trim(),
      category: form.category,
      priority: form.priority,
      status: "Open",
      assignee: "Unassigned",
      createdAt: now,
      updatedAt: now,
      resolvedAt: null,
      notes: [],
    };
    persist({ tickets: [t, ...tickets], nextId: nextId + 1 });
    setSelectedId(t.id);
    setView("detail");
  }

  function updateTicket(id, patch, noteText) {
    const now = new Date().toISOString();
    const newTickets = tickets.map((t) => {
      if (t.id !== id) return t;
      let notes = t.notes;
      const changes = [];
      ["status", "assignee", "priority", "category"].forEach((f) => {
        if (patch[f] !== undefined && patch[f] !== t[f]) {
          changes.push(f.charAt(0).toUpperCase() + f.slice(1) + ": " + t[f] + " → " + patch[f]);
        }
      });
      if (changes.length) notes = [...notes, { text: changes.join(" · "), at: now, system: true }];
      if (noteText) notes = [...notes, { text: noteText, at: now }];
      let resolvedAt = t.resolvedAt || null;
      if (patch.status === "Resolved" && t.status !== "Resolved") resolvedAt = now;
      if (patch.status && patch.status !== "Resolved") resolvedAt = null;
      return { ...t, ...patch, notes, resolvedAt, updatedAt: now };
    });
    persist({ tickets: newTickets });
  }

  function deleteTicket(id) {
    persist({ tickets: tickets.filter((t) => t.id !== id) });
    setView("list");
    setSelectedId(null);
  }

  const counts = useMemo(() => {
    const c = { Open: 0, "In Progress": 0, "On Hold": 0, Resolved: 0 };
    tickets.forEach((t) => { c[t.status] = (c[t.status] || 0) + 1; });
    return c;
  }, [tickets]);

  const overdueCount = useMemo(() => tickets.filter(isOverdue).length, [tickets]);

  const visible = useMemo(() => {
    return tickets.filter((t) => {
      if (statusFilter === "Active" && t.status === "Resolved") return false;
      if (statusFilter === "Overdue" && !isOverdue(t)) return false;
      if (statusFilter !== "All" && statusFilter !== "Active" && statusFilter !== "Overdue" && t.status !== statusFilter) return false;
      if (priorityFilter !== "All" && t.priority !== priorityFilter) return false;
      if (search) {
        const q = search.toLowerCase();
        const hay = (t.key + " " + t.subject + " " + t.requester + " " + t.category + " " + t.assignee).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }, [tickets, statusFilter, priorityFilter, search]);

  const selected = tickets.find((t) => t.id === selectedId);

  return (
    <div style={{ minHeight: "100vh", background: "#F6F8F9", fontFamily: sans, color: "#16212B" }}>
      {/* header */}
      <header style={{
        background: "#16212B", color: "#F6F8F9", padding: "14px 22px",
        display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10,
      }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
          <span style={{ fontFamily: mono, fontSize: 18, fontWeight: 700, letterSpacing: 1 }}>
            TICKET&nbsp;DESK
          </span>
          <span style={{ fontFamily: mono, fontSize: 11, color: "#8FA3B0" }}>
            internal helpdesk
          </span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          {view !== "list" && (
            <button onClick={() => { setView("list"); setSelectedId(null); }} style={{
              background: "transparent", color: "#F6F8F9", border: "1px solid #3D4C59",
              borderRadius: 6, padding: "7px 14px", fontSize: 13, cursor: "pointer",
            }}>
              ← Queue
            </button>
          )}
          {view !== "reports" && (
            <button onClick={() => { setView("reports"); setSelectedId(null); }} style={{
              background: "transparent", color: "#F6F8F9", border: "1px solid #3D4C59",
              borderRadius: 6, padding: "7px 14px", fontSize: 13, cursor: "pointer",
            }}>
              Reports
            </button>
          )}
          {view !== "team" && (
            <button onClick={() => { setView("team"); setSelectedId(null); }} style={{
              background: "transparent", color: "#F6F8F9", border: "1px solid #3D4C59",
              borderRadius: 6, padding: "7px 14px", fontSize: 13, cursor: "pointer",
            }}>
              Team
            </button>
          )}
          <button onClick={() => setView("new")} style={{
            background: "#0E7C66", color: "#fff", border: "none", borderRadius: 6,
            padding: "7px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer",
          }}>
            + New ticket
          </button>
        </div>
      </header>

      {/* queue strip */}
      <div style={{
        display: "flex", gap: 0, borderBottom: "1px solid #DDE3E8", background: "#fff",
        overflowX: "auto",
      }}>
        {STATUSES.map((s) => (
          <button
            key={s}
            onClick={() => { setStatusFilter(s === statusFilter ? "Active" : s); setView("list"); }}
            style={{
              flex: 1, minWidth: 110, padding: "12px 16px", background: statusFilter === s ? STATUS_STYLE[s].bg : "transparent",
              border: "none", borderRight: "1px solid #EEF1F3", cursor: "pointer", textAlign: "left",
            }}
          >
            <div style={{ fontFamily: mono, fontSize: 22, fontWeight: 700, color: STATUS_STYLE[s].fg }}>
              {counts[s]}
            </div>
            <div style={{ fontFamily: mono, fontSize: 10, letterSpacing: 0.8, color: "#5B6770", textTransform: "uppercase" }}>
              {s}
            </div>
          </button>
        ))}
        <button
          onClick={() => { setStatusFilter(statusFilter === "Overdue" ? "Active" : "Overdue"); setView("list"); }}
          style={{
            flex: 1, minWidth: 110, padding: "12px 16px",
            background: statusFilter === "Overdue" ? "#FDEBE8" : "transparent",
            border: "none", cursor: "pointer", textAlign: "left",
          }}
        >
          <div style={{ fontFamily: mono, fontSize: 22, fontWeight: 700, color: "#C0392B" }}>
            {overdueCount}
          </div>
          <div style={{ fontFamily: mono, fontSize: 10, letterSpacing: 0.8, color: "#5B6770", textTransform: "uppercase" }}>
            Overdue
          </div>
        </button>
      </div>

      {saveError && (
        <div style={{ background: "#FDEBE8", color: "#8C2B1D", padding: "8px 22px", fontSize: 13 }}>
          Couldn't save to browser storage. Changes may be lost when you close this tab — check that storage isn't full or blocked.
        </div>
      )}

      <main style={{ maxWidth: 860, margin: "0 auto", padding: "20px 16px 60px" }}>
        {loading ? (
          <div style={{ padding: 40, textAlign: "center", color: "#5B6770", fontFamily: mono, fontSize: 13 }}>
            Loading tickets…
          </div>
        ) : view === "new" ? (
          <NewTicketForm onCreate={createTicket} onCancel={() => setView("list")} />
        ) : view === "reports" ? (
          <ReportsView tickets={tickets} technicians={technicians} />
        ) : view === "team" ? (
          <TeamView
            technicians={technicians}
            tickets={tickets}
            onAdd={addTechnician}
            onRemove={removeTechnician}
          />
        ) : view === "detail" && selected ? (
          <TicketDetail
            ticket={selected}
            onUpdate={updateTicket}
            onDelete={deleteTicket}
            technicians={technicians}
          />
        ) : (
          <TicketList
            tickets={visible}
            total={tickets.length}
            statusFilter={statusFilter}
            setStatusFilter={setStatusFilter}
            priorityFilter={priorityFilter}
            setPriorityFilter={setPriorityFilter}
            search={search}
            setSearch={setSearch}
            onOpen={(id) => { setSelectedId(id); setView("detail"); }}
            onNew={() => setView("new")}
          />
        )}
      </main>
    </div>
  );
}

// ---------- list view ----------
function TicketList({ tickets, total, statusFilter, setStatusFilter, priorityFilter, setPriorityFilter, search, setSearch, onOpen, onNew }) {
  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <input
          placeholder="Search subject, requester, ticket #…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          style={{ ...inputStyle, flex: 2, minWidth: 200 }}
        />
        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 130 }}>
          <option value="Active">Active (not resolved)</option>
          <option value="Overdue">Overdue</option>
          <option value="All">All statuses</option>
          {STATUSES.map((s) => <option key={s}>{s}</option>)}
        </select>
        <select value={priorityFilter} onChange={(e) => setPriorityFilter(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 120 }}>
          <option value="All">All priorities</option>
          {PRIORITIES.map((p) => <option key={p}>{p}</option>)}
        </select>
      </div>

      {total === 0 ? (
        <div style={{
          background: "#fff", border: "1px dashed #CBD4DA", borderRadius: 10,
          padding: "48px 20px", textAlign: "center",
        }}>
          <div style={{ fontFamily: mono, fontSize: 14, color: "#3D4852", marginBottom: 8 }}>
            No tickets yet
          </div>
          <div style={{ fontSize: 13, color: "#5B6770", marginBottom: 16 }}>
            Log the first issue to start the queue.
          </div>
          <button onClick={onNew} style={{
            background: "#0E7C66", color: "#fff", border: "none", borderRadius: 6,
            padding: "9px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer",
          }}>
            + New ticket
          </button>
        </div>
      ) : tickets.length === 0 ? (
        <div style={{ padding: 30, textAlign: "center", color: "#5B6770", fontSize: 13 }}>
          No tickets match these filters.
        </div>
      ) : (
        tickets.map((t) => (
          <button
            key={t.id}
            onClick={() => onOpen(t.id)}
            style={{
              display: "block", width: "100%", textAlign: "left", cursor: "pointer",
              background: "#fff", border: "1px solid #E3E8EC", borderRadius: 8,
              borderLeft: "4px solid " + PRIORITY_COLOR[t.priority],
              padding: "12px 14px", marginBottom: 8, fontFamily: sans,
            }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                <span style={{ fontFamily: mono, fontSize: 12, color: "#5B6770" }}>{t.key}</span>
                <span style={{ fontSize: 14, fontWeight: 600, color: "#16212B", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 380 }}>
                  {t.subject}
                </span>
              </div>
              <StatusPill status={t.status} />
            </div>
            <div style={{ display: "flex", gap: 14, marginTop: 8, flexWrap: "wrap", fontSize: 12, color: "#5B6770", alignItems: "center" }}>
              <PriorityDot priority={t.priority} />
              <span>{t.category}</span>
              <span>from {t.requester || "—"}</span>
              <span>{t.assignee !== "Unassigned" ? "→ " + t.assignee : "unassigned"}</span>
              {dueLabel(t) && (
                <span style={{
                  fontFamily: mono, fontSize: 11,
                  color: isOverdue(t) ? "#C0392B" : "#5B6770",
                  fontWeight: isOverdue(t) ? 700 : 400,
                }}>
                  {dueLabel(t)}
                </span>
              )}
              <span style={{ marginLeft: "auto", fontFamily: mono, fontSize: 11 }}>{timeAgo(t.updatedAt)}</span>
            </div>
          </button>
        ))
      )}
    </div>
  );
}

// ---------- new ticket ----------
function NewTicketForm({ onCreate, onCancel }) {
  const [form, setForm] = useState({
    subject: "", description: "", requester: "",
    category: CATEGORIES[0], priority: "Medium",
  });
  const [touched, setTouched] = useState(false);
  const valid = form.subject.trim().length > 0;

  return (
    <div style={{ background: "#fff", border: "1px solid #E3E8EC", borderRadius: 10, padding: "22px 22px 16px", maxWidth: 620, margin: "0 auto" }}>
      <div style={{ fontFamily: mono, fontSize: 13, letterSpacing: 1, color: "#16212B", fontWeight: 700, marginBottom: 18 }}>
        NEW TICKET
      </div>

      <Field label="Subject *">
        <input
          style={{ ...inputStyle, borderColor: touched && !valid ? "#C0392B" : "#CBD4DA" }}
          value={form.subject}
          onChange={(e) => setForm({ ...form, subject: e.target.value })}
          placeholder="Short summary of the issue"
        />
        {touched && !valid && (
          <div style={{ fontSize: 12, color: "#C0392B", marginTop: 4 }}>Subject is required.</div>
        )}
      </Field>

      <Field label="Description">
        <textarea
          style={{ ...inputStyle, minHeight: 90, resize: "vertical" }}
          value={form.description}
          onChange={(e) => setForm({ ...form, description: e.target.value })}
          placeholder="What's happening, error messages, affected users…"
        />
      </Field>

      <Field label="Requester">
        <input
          style={inputStyle}
          value={form.requester}
          onChange={(e) => setForm({ ...form, requester: e.target.value })}
          placeholder="Name or email"
        />
      </Field>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <div style={{ flex: 1, minWidth: 160 }}>
          <Field label="Category">
            <select style={inputStyle} value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
              {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
            </select>
          </Field>
        </div>
        <div style={{ flex: 1, minWidth: 160 }}>
          <Field label="Priority">
            <select style={inputStyle} value={form.priority} onChange={(e) => setForm({ ...form, priority: e.target.value })}>
              {PRIORITIES.map((p) => <option key={p}>{p}</option>)}
            </select>
          </Field>
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 6 }}>
        <button onClick={onCancel} style={{
          background: "#fff", color: "#3D4852", border: "1px solid #CBD4DA",
          borderRadius: 6, padding: "9px 16px", fontSize: 13, cursor: "pointer",
        }}>
          Cancel
        </button>
        <button
          onClick={() => { setTouched(true); if (valid) onCreate(form); }}
          style={{
            background: "#0E7C66", color: "#fff", border: "none", borderRadius: 6,
            padding: "9px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer",
          }}
        >
          Create ticket
        </button>
      </div>
    </div>
  );
}

          </div>

// ---------- AI assist panel (deployment version) ----------
function AiPanel({ ticket, onUpdate }) {
  const [triage, setTriage] = useState(null);
  const [triageLoading, setTriageLoading] = useState(false);
  const [triageError, setTriageError] = useState("");

  async function runTriage() {
    setTriageLoading(true);
    setTriageError("");
    setTriage(null);
    try {
      const response = await fetch("/api/triage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          subject: ticket.subject,
          description: ticket.description,
          category: ticket.category,
          priority: ticket.priority,
        }),
      });
      if (!response.ok) throw new Error("Bad response: " + response.status);
      const parsed = await response.json();
      setTriage(parsed);
    } catch (e) {
      setTriageError("AI triage isn't wired up on this deployment yet — it needs the /api/triage Worker endpoint. The setup snippet is in the comment at the top of index.html.");
    } finally {
      setTriageLoading(false);
    }
  }

  const aiBtn = (loading) => ({
    background: loading ? "#8FA3B0" : "#16212B",
    color: "#fff",
    border: "none",
    borderRadius: 6,
    padding: "8px 14px",
    fontSize: 13,
    fontWeight: 600,
    cursor: loading ? "default" : "pointer",
  });

  const smallBtn = {
    background: "#fff",
    color: "#0E7C66",
    border: "1px solid #0E7C66",
    borderRadius: 6,
    padding: "5px 10px",
    fontSize: 12,
    fontWeight: 600,
    cursor: "pointer",
  };

  return (
    <div style={{
      background: "#fff", border: "1px solid #E3E8EC", borderRadius: 10,
      padding: "18px 22px", marginTop: 14,
    }}>
      <div style={{
        fontFamily: mono, fontSize: 11, letterSpacing: 0.8, color: "#5B6770",
        textTransform: "uppercase", marginBottom: 12,
      }}>
        AI assist
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <button onClick={runTriage} disabled={triageLoading} style={aiBtn(triageLoading)}>
          {triageLoading ? "Analyzing…" : "AI triage"}
        </button>
        <button disabled style={{
          background: "#EDF1F4", color: "#8593A0", border: "1px dashed #C3CCD3",
          borderRadius: 6, padding: "8px 14px", fontSize: 13, fontWeight: 600, cursor: "default",
        }}>
          M365 lookup — coming soon
        </button>
      </div>

      {triageError && (
        <div style={{ fontSize: 13, color: "#C0392B", marginTop: 10 }}>{triageError}</div>
      )}

      {triage && (
        <div style={{ marginTop: 14, background: "#F6F8F9", borderRadius: 8, padding: "12px 14px" }}>
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
            <span style={{ fontSize: 13 }}>
              Suggested category: <strong>{triage.category}</strong>{" "}
              {triage.category !== ticket.category && CATEGORIES.includes(triage.category) && (
                <button
                  style={{ ...smallBtn, marginLeft: 6 }}
                  onClick={() => onUpdate(ticket.id, { category: triage.category })}
                >
                  Apply
                </button>
              )}
            </span>
            <span style={{ fontSize: 13 }}>
              Suggested priority: <strong>{triage.priority}</strong>{" "}
              {triage.priority !== ticket.priority && PRIORITIES.includes(triage.priority) && (
                <button
                  style={{ ...smallBtn, marginLeft: 6 }}
                  onClick={() => onUpdate(ticket.id, { priority: triage.priority })}
                >
                  Apply
                </button>
              )}
            </span>
          </div>
          {triage.reasoning && (
            <div style={{ fontSize: 12.5, color: "#5B6770", marginBottom: 10 }}>{triage.reasoning}</div>
          )}
          {triage.firstResponse && (
            <div>
              <div style={{
                fontFamily: mono, fontSize: 10, letterSpacing: 0.8, color: "#5B6770",
                textTransform: "uppercase", marginBottom: 4,
              }}>
                Draft first response
              </div>
              <div style={{ fontSize: 13.5, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>
                {triage.firstResponse}
              </div>
              <button
                style={{ ...smallBtn, marginTop: 8 }}
                onClick={() => onUpdate(ticket.id, {}, "Draft reply to requester:\n" + triage.firstResponse)}
              >
                Save draft to work notes
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ---------- reports view ----------
function ReportsView({ tickets, technicians }) {
  const stats = useMemo(() => {
    const total = tickets.length;
    const resolved = tickets.filter((t) => t.status === "Resolved");
    const active = total - resolved.length;

    let avgResolutionMs = null;
    if (resolved.length) {
      const sum = resolved.reduce((acc, t) => {
        const end = new Date(t.resolvedAt || t.updatedAt).getTime();
        return acc + Math.max(0, end - new Date(t.createdAt).getTime());
      }, 0);
      avgResolutionMs = sum / resolved.length;
    }

    const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
    const resolvedLast7 = resolved.filter(
      (t) => new Date(t.resolvedAt || t.updatedAt).getTime() >= weekAgo
    ).length;

    const countBy = (fn) => {
      const m = {};
      tickets.forEach((t) => { const k = fn(t); m[k] = (m[k] || 0) + 1; });
      return m;
    };

    const byCategory = countBy((t) => t.category);
    const byPriority = countBy((t) => t.priority);

    const byTech = {};
    ["Unassigned", ...technicians].forEach((tech) => {
      const mine = tickets.filter((t) => t.assignee === tech);
      if (mine.length) {
        byTech[tech] = {
          active: mine.filter((t) => t.status !== "Resolved").length,
          resolved: mine.filter((t) => t.status === "Resolved").length,
        };
      }
    });
    tickets.forEach((t) => {
      if (!(t.assignee in byTech)) {
        byTech[t.assignee] = {
          active: tickets.filter((x) => x.assignee === t.assignee && x.status !== "Resolved").length,
          resolved: tickets.filter((x) => x.assignee === t.assignee && x.status === "Resolved").length,
        };
      }
    });

    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - i);
      const next = new Date(d);
      next.setDate(d.getDate() + 1);
      days.push({
        label: d.toLocaleDateString(undefined, { month: "numeric", day: "numeric" }),
        count: tickets.filter((t) => {
          const c = new Date(t.createdAt).getTime();
          return c >= d.getTime() && c < next.getTime();
        }).length,
      });
    }

    return { total, active, resolvedCount: resolved.length, avgResolutionMs, resolvedLast7, byCategory, byPriority, byTech, days };
  }, [tickets, technicians]);

  function fmtDuration(ms) {
    if (ms == null) return "—";
    const h = ms / 3600000;
    if (h < 1) return Math.max(1, Math.round(ms / 60000)) + "m";
    if (h < 48) return h.toFixed(1) + "h";
    return (h / 24).toFixed(1) + "d";
  }

  function exportCsv() {
    const esc = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const header = ["Key", "Subject", "Requester", "Category", "Priority", "Status", "Assignee", "Created", "Resolved", "LastUpdated", "NotesCount"];
    const rows = tickets.map((t) =>
      [t.key, t.subject, t.requester, t.category, t.priority, t.status, t.assignee, t.createdAt, t.resolvedAt || "", t.updatedAt, t.notes.length]
        .map(esc).join(",")
    );
    const blob = new Blob([header.map(esc).join(",") + "\n" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "helpdesk-tickets.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  const card = { background: "#fff", border: "1px solid #E3E8EC", borderRadius: 10, padding: "18px 22px", marginBottom: 14 };
  const sectionLabel = {
    fontFamily: mono, fontSize: 11, letterSpacing: 0.8, color: "#5B6770",
    textTransform: "uppercase", marginBottom: 12,
  };

  function BarRow({ label, count, max, color }) {
    const pct = max ? Math.max(4, Math.round((count / max) * 100)) : 0;
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7 }}>
        <span style={{ width: 130, fontSize: 12.5, color: "#3D4852", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{label}</span>
        <div style={{ flex: 1, background: "#F0F3F5", borderRadius: 4, height: 14 }}>
          <div style={{ width: pct + "%", height: "100%", background: color, borderRadius: 4 }} />
        </div>
        <span style={{ fontFamily: mono, fontSize: 12, color: "#16212B", width: 28, textAlign: "right" }}>{count}</span>
      </div>
    );
  }

  if (tickets.length === 0) {
    return (
      <div style={{ ...card, textAlign: "center", padding: "48px 20px" }}>
        <div style={{ fontFamily: mono, fontSize: 14, color: "#3D4852", marginBottom: 8 }}>No data to report yet</div>
        <div style={{ fontSize: 13, color: "#5B6770" }}>Reports will populate as tickets are logged and resolved.</div>
      </div>
    );
  }

  const maxCat = Math.max(...Object.values(stats.byCategory));
  const maxPri = Math.max(...Object.values(stats.byPriority));
  const maxDay = Math.max(1, ...stats.days.map((d) => d.count));
  const maxTech = Math.max(...Object.values(stats.byTech).map((v) => v.active + v.resolved));

  const kpi = (label, value, sub) => (
    <div key={label} style={{ flex: 1, minWidth: 120, background: "#fff", border: "1px solid #E3E8EC", borderRadius: 10, padding: "14px 16px" }}>
      <div style={{ fontFamily: mono, fontSize: 24, fontWeight: 700, color: "#16212B" }}>{value}</div>
      <div style={{ fontFamily: mono, fontSize: 10, letterSpacing: 0.8, color: "#5B6770", textTransform: "uppercase", marginTop: 2 }}>{label}</div>
      {sub && <div style={{ fontSize: 11.5, color: "#8593A0", marginTop: 4 }}>{sub}</div>}
    </div>
  );

  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontFamily: mono, fontSize: 13, letterSpacing: 1, fontWeight: 700 }}>REPORTS</span>
        <button onClick={exportCsv} style={{
          background: "#16212B", color: "#fff", border: "none", borderRadius: 6,
          padding: "8px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer",
        }}>
          Export CSV
        </button>
      </div>

      {/* KPIs */}
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        {kpi("Total tickets", stats.total)}
        {kpi("Active", stats.active)}
        {kpi("Resolved", stats.resolvedCount, stats.resolvedLast7 + " in last 7 days")}
        {kpi("Avg resolution", fmtDuration(stats.avgResolutionMs), "open → resolved")}
      </div>

      {/* trend */}
      <div style={card}>
        <div style={sectionLabel}>Tickets created — last 14 days</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 90 }}>
          {stats.days.map((d, i) => (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <span style={{ fontFamily: mono, fontSize: 10, color: d.count ? "#3D4852" : "#C3CCD3" }}>{d.count || ""}</span>
              <div style={{
                width: "100%", maxWidth: 26, borderRadius: "3px 3px 0 0",
                height: Math.max(3, Math.round((d.count / maxDay) * 60)),
                background: d.count ? "#0E7C66" : "#E8EDF0",
              }} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
          <span style={{ fontFamily: mono, fontSize: 10, color: "#8593A0" }}>{stats.days[0].label}</span>
          <span style={{ fontFamily: mono, fontSize: 10, color: "#8593A0" }}>{stats.days[13].label}</span>
        </div>
      </div>

      {/* breakdowns */}
      <div style={card}>
        <div style={sectionLabel}>By category</div>
        {Object.entries(stats.byCategory).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
          <BarRow key={k} label={k} count={v} max={maxCat} color="#0E7C66" />
        ))}
      </div>

      <div style={card}>
        <div style={sectionLabel}>By priority</div>
        {PRIORITIES.filter((p) => stats.byPriority[p]).map((p) => (
          <BarRow key={p} label={p} count={stats.byPriority[p]} max={maxPri} color={PRIORITY_COLOR[p]} />
        ))}
      </div>

      <div style={card}>
        <div style={sectionLabel}>Workload by engineer</div>
        {Object.entries(stats.byTech).sort((a, b) => (b[1].active + b[1].resolved) - (a[1].active + a[1].resolved)).map(([tech, v]) => (
          <div key={tech} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7 }}>
            <span style={{ width: 130, fontSize: 12.5, color: "#3D4852", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{tech}</span>
            <div style={{ flex: 1, display: "flex", background: "#F0F3F5", borderRadius: 4, height: 14, overflow: "hidden" }}>
              <div style={{ width: maxTech ? ((v.active / maxTech) * 100) + "%" : 0, background: "#E67E22", height: "100%" }} />
              <div style={{ width: maxTech ? ((v.resolved / maxTech) * 100) + "%" : 0, background: "#0E7C66", height: "100%" }} />
            </div>
            <span style={{ fontFamily: mono, fontSize: 12, color: "#16212B", width: 70, textAlign: "right" }}>
              {v.active} / {v.resolved}
            </span>
          </div>
        ))}
        <div style={{ fontSize: 11.5, color: "#8593A0", marginTop: 8 }}>
          <span style={{ color: "#E67E22" }}>■</span> active&nbsp;&nbsp;
          <span style={{ color: "#0E7C66" }}>■</span> resolved&nbsp;&nbsp;(counts shown as active / resolved)
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HelpdeskApp />);
</script>
</body>
</html>
