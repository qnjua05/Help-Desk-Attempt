<!DOCTYPE html>
<!--
  TICKET DESK — frontend (D1 backend version)
  This file must live at public/index.html in the repo.
  It calls the Worker API in worker.js — see SETUP.md for the full deploy steps.
  Tickets are now stored in Cloudflare D1, shared by everyone who opens the site.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MESHELPDESK — Internal Helpdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0E1C2E;          /* console ink — header stays fixed in both themes */
    --dispatch: #0E7C66;     /* action green */
    --alarm: #C0392B;

    --paper: #EEF2F5;
    --grid-line: rgba(14, 28, 46, 0.04);
    --card: #FFFFFF;
    --well: #F4F6F8;
    --track: #F0F3F5;
    --card-border: #D9E1E8;
    --border-soft: #EEF1F3;
    --input-border: #CBD4DA;
    --text: #16212B;
    --text-soft: #3D4852;
    --text-mut: #5B6770;
    --text-faint: #8593A0;
    --ink-btn: #16212B;
    --placeholder: #93A1AD;
    --shadow: rgba(14, 28, 46, 0.10);
    --hazard-alt: #F6D5D0;
    --alarm-bg: #FDEBE8;
    --alarm-fg: #8C2B1D;
    --alarm-fg-btn: #8C2B1D;
    --alarm-strong: #C0392B;
    --st-open-bg: #EAF3FB;  --st-open-fg: #1F5C8B;
    --st-prog-bg: #FDF3E3;  --st-prog-fg: #9A6008;
    --st-hold-bg: #F0EDF7;  --st-hold-fg: #5B4A8A;
    --st-dev-bg: #E3F2FB;   --st-dev-fg: #0B6E8F;
    --st-qa-bg: #FBEAF3;    --st-qa-fg: #A03A6B;
    --st-uat-bg: #EAF6E7;   --st-uat-fg: #2E7D32;
    --st-rdy-bg: #ECEFFB;   --st-rdy-fg: #3A4AA3;
    --st-res-bg: #E7F4EF;   --st-res-fg: #0E7C66;
  }
  [data-theme="dark"] {
    --paper: #0D141D;
    --grid-line: rgba(255, 255, 255, 0.035);
    --card: #17222E;
    --well: #101923;
    --track: #223140;
    --card-border: #27384A;
    --border-soft: #1F2C3A;
    --input-border: #35485E;
    --text: #E6ECF2;
    --text-soft: #C0CBD6;
    --text-mut: #94A4B2;
    --text-faint: #6E7F8D;
    --ink-btn: #3A4C61;
    --placeholder: #5C6E7E;
    --shadow: rgba(0, 0, 0, 0.45);
    --hazard-alt: #4A2620;
    --alarm-bg: #3A1F1B;
    --alarm-fg: #F0A296;
    --alarm-fg-btn: #A03A2A;
    --alarm-strong: #E4695A;
    --st-open-bg: #14324A;  --st-open-fg: #7FB8E8;
    --st-prog-bg: #3A2E12;  --st-prog-fg: #E0B25E;
    --st-hold-bg: #2A2440;  --st-hold-fg: #B3A4E0;
    --st-dev-bg: #0F2E3D;   --st-dev-fg: #6FCDEB;
    --st-qa-bg: #3A1F2E;    --st-qa-fg: #E48FB9;
    --st-uat-bg: #1E3320;   --st-uat-fg: #8FD694;
    --st-rdy-bg: #1C2340;   --st-rdy-fg: #9AA8F0;
    --st-res-bg: #123329;   --st-res-fg: #5CC7A8;
  }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  button { font-family: inherit; transition: filter .15s ease, transform .15s ease, box-shadow .15s ease; }
  button:not(:disabled):hover { filter: brightness(1.07); }
  input, select, textarea { font-family: inherit; transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--dispatch) !important;
    box-shadow: 0 0 0 3px rgba(14, 124, 102, 0.14);
  }
  :focus-visible { outline: 2px solid var(--dispatch); outline-offset: 2px; }
  ::placeholder { color: var(--placeholder); }

  /* ticket cards in the queue */
  .tkt-card { transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; }
  .tkt-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px var(--shadow);
    filter: none;
  }

  /* signature: hazard-stripe rail on overdue tickets */
  .hazard {
    border-left-color: transparent !important;
    background-image:
      linear-gradient(var(--card), var(--card)),
      repeating-linear-gradient(45deg, var(--alarm-strong) 0 6px, var(--hazard-alt) 6px 12px);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    animation: hazard-crawl 1.6s linear infinite;
  }
  @keyframes hazard-crawl {
    to { background-position: 0 0, 0 17px; }
  }

  /* master-detail split layout for the queue view */
  .split-main {
    display: grid;
    grid-template-columns: minmax(300px, var(--list-w, 430px)) 8px minmax(0, 1fr);
    gap: 0 12px;
    align-items: start;
    padding: 20px 22px 40px;
  }
  .list-pane { min-width: 0; }
  .pane-divider {
    width: 8px; align-self: stretch; cursor: col-resize;
    position: relative; border-radius: 4px;
  }
  .pane-divider::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px;
    background: var(--card-border); border-radius: 2px;
  }
  .pane-divider:hover::after, .pane-divider.dragging::after { background: var(--dispatch); }
  .detail-pane-wrap {
    position: sticky; top: 16px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;
    padding-right: 3px;
  }
  .tkt-scroll {
    max-height: calc(100vh - 320px);
    overflow-y: auto;
    padding-right: 5px;
  }
  .tkt-scroll, .detail-pane-wrap { scrollbar-width: thin; scrollbar-color: var(--input-border) transparent; }
  .tkt-scroll::-webkit-scrollbar, .detail-pane-wrap::-webkit-scrollbar { width: 8px; }
  .tkt-scroll::-webkit-scrollbar-thumb, .detail-pane-wrap::-webkit-scrollbar-thumb {
    background: var(--input-border); border-radius: 4px;
  }
  .tkt-scroll::-webkit-scrollbar-thumb:hover, .detail-pane-wrap::-webkit-scrollbar-thumb:hover {
    background: var(--text-faint);
  }
  .pane-placeholder {
    background: var(--card); border: 1px dashed var(--input-border); border-radius: 10px;
    padding: 60px 24px; text-align: center; color: var(--text-faint);
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.5px;
  }
  .tkt-card.sel {
    border-color: var(--dispatch);
    box-shadow: 0 0 0 2px rgba(14, 124, 102, 0.22);
  }
  @media (max-width: 980px) {
    .split-main { grid-template-columns: 1fr; }
    .pane-divider { display: none; }
    .detail-pane-wrap { position: static; order: -1; max-height: none; overflow: visible; }
    .tkt-scroll { max-height: none; overflow: visible; padding-right: 0; }
    .pane-placeholder { display: none; }
  }

  /* next-SLA ticker above the queue */
  .sla-tick {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 8px; padding: 9px 14px; display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--text-soft); flex-wrap: wrap; cursor: pointer;
    text-align: left; font-family: inherit; width: 100%; margin-bottom: 16px;
  }
  .sla-tick:hover { box-shadow: 0 4px 14px var(--shadow); filter: none; }
  .sla-tick .tag {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 1px;
    color: var(--st-prog-fg); background: var(--st-prog-bg); border-radius: 4px; padding: 3px 7px;
    text-transform: uppercase; font-weight: 600;
  }

  /* live refresh indicator in the header */
  .livedot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2EBD85; display: inline-block;
    box-shadow: 0 0 0 0 rgba(46, 189, 133, 0.55);
    animation: live-pulse 2.4s ease-out infinite;
  }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 rgba(46, 189, 133, 0.55); }
    70% { box-shadow: 0 0 0 7px rgba(46, 189, 133, 0); }
    100% { box-shadow: 0 0 0 0 rgba(46, 189, 133, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hazard, .livedot { animation: none; }
    .tkt-card, button, input, select, textarea { transition: none; }
    .tkt-card:hover { transform: none; }
  }
</style>
<script>
  document.documentElement.dataset.theme =
    localStorage.getItem("td-theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- constants ----------
const CATEGORIES = ["Hardware", "Software", "Network", "Accounts & Access", "Email / M365", "Printing", "Other"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const SLA_HOURS = { Critical: 4, High: 24, Medium: 72, Low: 120 }; // resolution targets
const SLA_ENABLED = false; // TESTING: SLA timers & overdue flags paused. Set true to resume; clocks pick up from ticket createdAt.
const STATUSES = ["Open", "In Progress", "On Hold", "In Development", "In QA", "UAT", "Ready for Deployment", "Resolved"];
const REQUEST_TYPES = ["Incident", "Service Request", "Question", "Change"];
const REQUEST_TYPE_EDGE = { Incident: "var(--alarm-strong)", "Service Request": "#2980B9" };
const SUBCATS = {
  "Hardware": ["Laptop", "Desktop", "Monitor / Peripherals", "Printer / Scanner", "Mobile device", "Other hardware"],
  "Software": ["Business application", "Operating system", "Browser", "Licensing / Install", "Other software"],
  "Network": ["Wi-Fi / Wireless", "VPN", "Wired / Switch", "Internet / WAN", "Firewall / Zero Trust", "Other network"],
  "Accounts & Access": ["Password reset", "New account", "Permissions / Groups", "MFA / Sign-in", "Offboarding", "Other access"],
  "Email / M365": ["Outlook / Exchange", "Teams", "SharePoint / OneDrive", "Distribution groups", "Licensing", "Other M365"],
  "Printing": ["Cannot print", "Print quality", "Scanner / Copier", "Driver / Queue", "Other printing"],
  "Other": ["General request", "Facilities / AV", "Uncategorized"],
};

const PRIORITY_COLOR = {
  Critical: "#C0392B",
  High: "#E67E22",
  Medium: "#2980B9",
  Low: "#7F8C8D",
};

const STATUS_STYLE = {
  Open: { bg: "var(--st-open-bg)", fg: "var(--st-open-fg)" },
  "In Progress": { bg: "var(--st-prog-bg)", fg: "var(--st-prog-fg)" },
  "On Hold": { bg: "var(--st-hold-bg)", fg: "var(--st-hold-fg)" },
  "In Development": { bg: "var(--st-dev-bg)", fg: "var(--st-dev-fg)" },
  "In QA": { bg: "var(--st-qa-bg)", fg: "var(--st-qa-fg)" },
  UAT: { bg: "var(--st-uat-bg)", fg: "var(--st-uat-fg)" },
  "Ready for Deployment": { bg: "var(--st-rdy-bg)", fg: "var(--st-rdy-fg)" },
  Resolved: { bg: "var(--st-res-bg)", fg: "var(--st-res-fg)" },
};

const mono = "'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
const sans = "'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

// Default status-tab layout: every status visible, Overdue hidden by default.
const DEFAULT_TABS = [...STATUSES.map((s) => ({ key: s, on: true })), { key: "Overdue", on: false }];

// Merge saved prefs with the current status list, so statuses added after an
// engineer saved their layout still show up (new ones default to visible).
function mergeTabPrefs(saved) {
  const all = [...STATUSES, "Overdue"];
  const merged = saved.filter((t) => t && all.includes(t.key)).map((t) => ({ key: t.key, on: !!t.on }));
  all.forEach((k) => {
    if (!merged.some((t) => t.key === k)) merged.push({ key: k, on: k !== "Overdue" });
  });
  return merged;
}

// ---------- API layer ----------
async function api(path, options) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
  return data;
}

// ---------- helpers ----------
function dueAt(t) {
  return new Date(new Date(t.createdAt).getTime() + (SLA_HOURS[t.priority] || 72) * 3600000);
}

function isOverdue(t) {
  if (!SLA_ENABLED) return false;
  return t.status !== "Resolved" && Date.now() > dueAt(t).getTime();
}

function isDueSoon(t) {
  if (!SLA_ENABLED) return false;
  if (t.status === "Resolved") return false;
  const remaining = dueAt(t).getTime() - Date.now();
  return remaining > 0 && remaining <= 4 * 3600000; // due within 4 hours
}

function dueLabel(t) {
  if (!SLA_ENABLED) return null;
  if (t.status === "Resolved") return null;
  const diff = dueAt(t).getTime() - Date.now();
  const abs = Math.abs(diff);
  const h = abs / 3600000;
  const span = h < 1 ? Math.max(1, Math.round(abs / 60000)) + "m" : h < 48 ? Math.round(h) + "h" : Math.round(h / 24) + "d";
  return diff >= 0 ? "due in " + span : "overdue " + span;
}

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  return d + "d ago";
}

function fmtDate(iso) {
  return new Date(iso).toLocaleString(undefined, {
    month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
  });
}

// ---------- small components ----------
function StatusPill({ status }) {
  const s = STATUS_STYLE[status] || STATUS_STYLE.Open;
  return (
    <span style={{
      background: s.bg, color: s.fg, fontFamily: mono, fontSize: 11,
      padding: "3px 8px", borderRadius: 4, fontWeight: 600, letterSpacing: 0.3,
      whiteSpace: "nowrap",
    }}>
      {status.toUpperCase()}
    </span>
  );
}

function PriorityDot({ priority }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--text-soft)" }}>
      <span style={{
        width: 8, height: 8, borderRadius: 2, background: PRIORITY_COLOR[priority],
        display: "inline-block",
      }} />
      {priority}
    </span>
  );
}

function Field({ label, children }) {
  return (
    <label style={{ display: "block", marginBottom: 14 }}>
      <div style={{
        fontFamily: mono, fontSize: 11, letterSpacing: 0.8, color: "var(--text-mut)",
        marginBottom: 5, textTransform: "uppercase",
      }}>{label}</div>
      {children}
    </label>
  );
}

const inputStyle = {
  width: "100%", boxSizing: "border-box", padding: "9px 11px",
  border: "1px solid var(--input-border)", borderRadius: 6, fontSize: 14,
  fontFamily: sans, background: "var(--card)", color: "var(--text)", outline: "none",
};

// ---------- main app ----------
function HelpdeskApp() {
  const [tickets, setTickets] = useState([]);
  const [technicians, setTechnicians] = useState([]);
  const [loading, setLoading] = useState(true);
  const [apiError, setApiError] = useState("");

  const [view, setView] = useState("list"); // list | new | detail | team | reports
  const [menuOpen, setMenuOpen] = useState(false);
  const [selectedId, setSelectedId] = useState(null);

  const [statusFilter, setStatusFilter] = useState("Active");
  const [priorityFilter, setPriorityFilter] = useState("All");
  const [assigneeFilter, setAssigneeFilter] = useState("All");
  const [search, setSearch] = useState("");

  const [darkMode, setDarkMode] = useState(() => document.documentElement.dataset.theme === "dark");
  useEffect(() => {
    const theme = darkMode ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
    localStorage.setItem("td-theme", theme);
  }, [darkMode]);

  // per-engineer status tab layout (order + visibility)
  const [tabPrefs, setTabPrefs] = useState(DEFAULT_TABS);
  const [tabsOpen, setTabsOpen] = useState(false);

  useEffect(() => {
    api("/api/prefs/tabs")
      .then((d) => {
        if (Array.isArray(d.tabs) && d.tabs.length) setTabPrefs(mergeTabPrefs(d.tabs));
      })
      .catch(() => {}); // no saved layout yet, or endpoint unreachable — defaults are fine
  }, []);

  async function saveTabPrefs(next) {
    setTabPrefs(next);
    setTabsOpen(false);
    try {
      await api("/api/prefs/tabs", { method: "PUT", body: JSON.stringify({ tabs: next }) });
      setApiError("");
    } catch (e) {
      setApiError("Couldn't save your tab layout — " + e.message);
    }
  }

  async function loadState(silent) {
    if (!silent) setLoading(true);
    try {
      const data = await api("/api/state");
      setTickets(data.tickets || []);
      setTechnicians(data.technicians || []);
      setApiError("");
    } catch (e) {
      setApiError("Couldn't reach the ticket server — " + e.message);
    } finally {
      setLoading(false);
    }
  }

  // initial load + background refresh (on focus and every 60s)
  useEffect(() => {
    loadState();
    const onFocus = () => loadState(true);
    window.addEventListener("focus", onFocus);
    const iv = setInterval(() => {
      if (document.visibilityState === "visible") loadState(true);
    }, 60000);
    return () => {
      window.removeEventListener("focus", onFocus);
      clearInterval(iv);
    };
  }, []);

  async function createTicket(form) {
    try {
      const t = await api("/api/tickets", { method: "POST", body: JSON.stringify(form) });
      setTickets((prev) => [t, ...prev]);
      setSelectedId(t.id);
      setView("list"); // new ticket opens in the split-view pane
      setApiError("");
    } catch (e) {
      setApiError("Couldn't create ticket — " + e.message);
    }
  }

  function openTicket(id) {
    setSelectedId(id);
    setView("list");
    // on narrow screens the pane sits above the queue — bring it into view
    if (window.innerWidth < 980) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function updateTicket(id, patch, noteText) {
    try {
      let t = null;
      if (patch && Object.keys(patch).length) {
        t = await api("/api/tickets/" + id, { method: "PATCH", body: JSON.stringify(patch) });
      }
      if (noteText) {
        t = await api("/api/tickets/" + id + "/notes", { method: "POST", body: JSON.stringify({ text: noteText }) });
      }
      if (t) setTickets((prev) => prev.map((x) => (x.id === id ? t : x)));
      setApiError("");
    } catch (e) {
      setApiError("Couldn't update ticket — " + e.message);
    }
  }

  async function deleteTicket(id) {
    try {
      await api("/api/tickets/" + id, { method: "DELETE" });
      setTickets((prev) => prev.filter((t) => t.id !== id));
      setView("list");
      setSelectedId(null);
      setApiError("");
    } catch (e) {
      setApiError("Couldn't delete ticket — " + e.message);
    }
  }

  async function addTechnician(name) {
    const n = name.trim();
    if (!n || n === "Unassigned") return;
    try {
      const data = await api("/api/technicians", { method: "POST", body: JSON.stringify({ name: n }) });
      setTechnicians(data.technicians || []);
      setApiError("");
    } catch (e) {
      setApiError("Couldn't add engineer — " + e.message);
    }
  }

  async function removeTechnician(name) {
    try {
      const data = await api("/api/technicians/" + encodeURIComponent(name), { method: "DELETE" });
      setTechnicians(data.technicians || []);
      setApiError("");
    } catch (e) {
      setApiError("Couldn't remove engineer — " + e.message);
    }
  }

  const counts = useMemo(() => {
    const c = {};
    STATUSES.forEach((s) => { c[s] = 0; });
    tickets.forEach((t) => { c[t.status] = (c[t.status] || 0) + 1; });
    return c;
  }, [tickets]);

  const overdueCount = useMemo(() => tickets.filter(isOverdue).length, [tickets]);

  const nextSla = useMemo(() => {
    const active = tickets.filter((t) => t.status !== "Resolved");
    return active.slice().sort((a, b) => dueAt(a).getTime() - dueAt(b).getTime())[0] || null;
  }, [tickets]);

  const visible = useMemo(() => {
    const QUICK = ["All", "Active", "Overdue", "Unassigned", "DueSoon"];
    return tickets.filter((t) => {
      if (statusFilter === "Active" && t.status === "Resolved") return false;
      if (statusFilter === "Overdue" && !isOverdue(t)) return false;
      if (statusFilter === "Unassigned" && (t.status === "Resolved" || t.assignee !== "Unassigned")) return false;
      if (statusFilter === "DueSoon" && !isDueSoon(t)) return false;
      if (!QUICK.includes(statusFilter) && t.status !== statusFilter) return false;
      if (priorityFilter !== "All" && t.priority !== priorityFilter) return false;
      if (assigneeFilter !== "All" && t.assignee !== assigneeFilter) return false;
      if (search) {
        const q = search.toLowerCase();
        const hay = (t.key + " " + t.subject + " " + t.requester + " " + t.category + " " + t.assignee).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }, [tickets, statusFilter, priorityFilter, assigneeFilter, search]);

  const selected = tickets.find((t) => t.id === selectedId);

  return (
    <div style={{ minHeight: "100vh", background: "transparent", fontFamily: sans, color: "var(--text)" }}>
      {/* header */}
      <header style={{
        background: "#0E1C2E", color: "#F6F8F9", padding: "14px 22px",
        borderBottom: "3px solid #0E7C66",

// ---------- per-engineer tab settings drawer ----------
function TabSettings({ prefs, onCancel, onSave }) {
  const [draft, setDraft] = useState(prefs.map((t) => ({ key: t.key, on: t.on })));
  const [dragIdx, setDragIdx] = useState(null);
  const atLeastOne = draft.some((t) => t.on);

  function moveRow(from, to) {
    if (from === to || from == null || to == null) return;
    setDraft((d) => {
      const next = d.slice();
      const [row] = next.splice(from, 1);
      next.splice(to, 0, row);
      return next;
    });
  }

  return (
    <React.Fragment>
      <div onClick={onCancel} style={{ position: "fixed", inset: 0, zIndex: 190, background: "var(--shadow)" }} />
      <div style={{
        position: "fixed", top: 0, right: 0, bottom: 0, zIndex: 200,
        width: "min(380px, 92vw)", background: "var(--card)",
        borderLeft: "1px solid var(--card-border)", boxShadow: "0 0 32px var(--shadow)",
        padding: 22, overflowY: "auto",
      }}>
        <div style={{ fontFamily: mono, fontSize: 12, letterSpacing: 1.2, textTransform: "uppercase", color: "var(--text-mut)", marginBottom: 4 }}>
          My status tabs
        </div>
        <div style={{ fontSize: 12, color: "var(--text-mut)", lineHeight: 1.5, marginBottom: 14 }}>
          Drag to reorder. Untick to hide a tab from your queue strip. Saved to your profile {"\u2014"} follows you on any device.
        </div>

        {draft.map((t, i) => (
          <div
            key={t.key}
            draggable
            onDragStart={() => setDragIdx(i)}
            onDragEnd={() => setDragIdx(null)}
            onDragOver={(e) => e.preventDefault()}
            onDrop={(e) => { e.preventDefault(); moveRow(dragIdx, i); setDragIdx(null); }}
            style={{
              display: "flex", alignItems: "center", gap: 10,
              background: "var(--well)", border: "1px solid var(--card-border)",
              borderRadius: 6, padding: "9px 12px", marginBottom: 6,
              cursor: "grab", opacity: dragIdx === i ? 0.4 : 1, userSelect: "none",
            }}
          >
            <span style={{ color: "var(--text-faint)", fontSize: 13 }}>{"\u22EE\u22EE"}</span>
            <input
              type="checkbox"
              checked={t.on}
              onChange={(e) => {
                const on = e.target.checked;
                setDraft((d) => d.map((row, j) => (j === i ? { key: row.key, on } : row)));
              }}
              style={{ width: 15, height: 15, cursor: "pointer" }}
            />
            <span style={{ flex: 1, fontSize: 13 }}>{t.key}</span>
            {t.key === "Overdue" && (
              <span style={{ fontSize: 10, color: "var(--text-faint)" }}>hidden by default</span>
            )}
          </div>
        ))}

        {!atLeastOne && (
          <div style={{ fontSize: 12, color: "var(--alarm-strong)", margin: "8px 0" }}>
            Keep at least one tab enabled.
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 14 }}>
          <button
            onClick={onCancel}
            style={{
              background: "transparent", color: "var(--text-mut)", border: "1px solid var(--card-border)",
              borderRadius: 6, padding: "8px 16px", fontSize: 13, cursor: "pointer", fontFamily: "inherit",
            }}
          >
            Cancel
          </button>
          <button
            onClick={() => atLeastOne && onSave(draft)}
            disabled={!atLeastOne}
            style={{
              background: "#0E7C66", color: "#F6F8F9", border: "1px solid #0E7C66",
              borderRadius: 6, padding: "8px 16px", fontSize: 13, fontWeight: 700,
              cursor: atLeastOne ? "pointer" : "not-allowed", opacity: atLeastOne ? 1 : 0.5,
              fontFamily: "inherit",
            }}
          >
            Save
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

// ---------- list view ----------
function PaneDivider() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    try {
      const saved = localStorage.getItem("hd_list_w");
      if (saved && ref.current) ref.current.parentElement.style.setProperty("--list-w", saved);
    } catch (e) {}
  }, []);
  function onDown(e) {
    e.preventDefault();
    const el = ref.current;
    const main = el.parentElement;
    const startX = e.clientX;
    const startW = main.querySelector(".list-pane").getBoundingClientRect().width;
    el.classList.add("dragging");
    function move(ev) {
      const w = Math.min(Math.max(startW + (ev.clientX - startX), 300), Math.max(360, window.innerWidth * 0.6));
      main.style.setProperty("--list-w", Math.round(w) + "px");
    }
    function up() {
      el.classList.remove("dragging");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      try { localStorage.setItem("hd_list_w", main.style.getPropertyValue("--list-w")); } catch (e) {}
    }
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  }
  return <div ref={ref} className="pane-divider" onMouseDown={onDown} title="Drag to resize panes" />;
}

}

function TicketDetail({ ticket, onUpdate, onDelete, technicians, embedded, onClose }) {
  const [note, setNote] = useState("");
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState({ subject: "", description: "", requester: "" });
  const [triage, setTriage] = useState(null);
  const [triageLoading, setTriageLoading] = useState(false);
  const [triageError, setTriageError] = useState("");

  async function runTriage() {
    setTriageLoading(true);
    setTriageError("");
    setTriage(null);
    try {
      const parsed = await api("/api/triage", {
        method: "POST",
        body: JSON.stringify({
          subject: ticket.subject,
          description: ticket.description,
          category: ticket.category,
          priority: ticket.priority,
        }),
      });
      setTriage(parsed);
    } catch (e) {
      setTriageError(e.message || "AI triage failed — try again.");
    } finally {
      setTriageLoading(false);
    }
  }

  function startEdit() {
    setDraft({
      subject: ticket.subject || "",
      description: ticket.description || "",
      requester: ticket.requester || "",
    });
    setEditing(true);
  }
  function saveEdit() {
    if (!draft.subject.trim()) return;
    onUpdate(ticket.id, {
      subject: draft.subject.trim(),
      description: draft.description.trim(),
      requester: draft.requester.trim(),
    });
    setEditing(false);
  }
  const assigneeOptions = Array.from(new Set(["Unassigned", ...(technicians || []), ticket.assignee]));
  const subCatOptions = Array.from(new Set([
    ...(SUBCATS[ticket.category] || SUBCATS["Other"]),
    ...(ticket.subCategory ? [ticket.subCategory] : []),
  ]));

  function addNote() {
    if (!note.trim()) return;
    onUpdate(ticket.id, {}, note.trim());
    setNote("");
  }

  return (
    <div style={embedded ? {} : { maxWidth: 720, margin: "0 auto" }}>
      <div style={{
        background: "var(--card)", border: "1px solid var(--card-border)", borderRadius: 10,
        borderLeft: "5px solid " + PRIORITY_COLOR[ticket.priority],
        padding: "20px 22px",
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 6 }}>
          <span style={{ fontFamily: mono, fontSize: 13, color: "var(--text-mut)" }}>{ticket.key}</span>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
            <StatusPill status={ticket.status} />
            <button
              onClick={runTriage}
              disabled={triageLoading}
              title="Run AI triage on this ticket"
              style={{
                background: triageLoading ? "var(--text-faint)" : "var(--ink-btn)",
                color: "#fff", border: "none", borderRadius: 6,
                padding: "4px 10px", fontSize: 12, fontWeight: 600,
                cursor: triageLoading ? "default" : "pointer",
              }}
            >
              {triageLoading ? "Analyzing…" : "⚡ AI triage"}
            </button>
            <button
              onClick={() => (editing ? setEditing(false) : startEdit())}
              title={editing ? "Cancel edit" : "Edit details"}
              style={{
                background: "transparent", border: "1px solid var(--input-border)", borderRadius: 6,
                color: "var(--text-mut)", padding: "3px 9px", fontSize: 12, cursor: "pointer",
              }}
            >
              {editing ? "✕ Cancel" : "✎ Edit"}
            </button>
            {onClose && (
              <button
                onClick={onClose}
                title="Close"
                style={{
                  background: "transparent", border: "1px solid var(--input-border)", borderRadius: 6,
                  color: "var(--text-mut)", padding: "3px 9px", fontSize: 12, cursor: "pointer",
                }}
              >
                ✕
              </button>
            )}
          </span>
        </div>
        {editing ? (
          <div style={{ display: "grid", gap: 10, margin: "4px 0 16px" }}>
            <Field label="Subject">
              <input
                style={inputStyle} maxLength={300} value={draft.subject}
                onChange={(e) => setDraft({ ...draft, subject: e.target.value })}
              />
            </Field>
            <Field label="Requester">
              <input
                style={inputStyle} maxLength={200} value={draft.requester}
                onChange={(e) => setDraft({ ...draft, requester: e.target.value })}
              />
            </Field>
            <Field label="Description">
              <textarea
                style={{ ...inputStyle, minHeight: 110, resize: "vertical" }}
                value={draft.description}
                onChange={(e) => setDraft({ ...draft, description: e.target.value })}
              />
            </Field>
            <div>
              <button
                onClick={saveEdit}
                disabled={!draft.subject.trim()}
                style={{
                  background: "#0E7C66", color: "#fff", border: "none", borderRadius: 6,
                  padding: "8px 16px", fontSize: 13, fontWeight: 600,
                  cursor: draft.subject.trim() ? "pointer" : "not-allowed",
                  opacity: draft.subject.trim() ? 1 : 0.55,
                }}
              >
                Save changes
              </button>
            </div>
          </div>
        ) : (
          <h2 style={{ margin: "0 0 10px", fontSize: 19, fontWeight: 700 }}>{ticket.subject}</h2>
        )}

        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 13, color: "var(--text-soft)", marginBottom: 14 }}>
          <PriorityDot priority={ticket.priority} />
          <span>{ticket.requestType || "Incident"}</span>
          <span>{ticket.category}{ticket.subCategory ? " / " + ticket.subCategory : ""}</span>
          <span>Requester: <strong>{ticket.requester || "—"}</strong></span>
          <span style={{ fontFamily: mono, fontSize: 12, color: "var(--text-mut)" }}>opened {fmtDate(ticket.createdAt)}</span>
          {dueLabel(ticket) && (
            <span style={{
              fontFamily: mono, fontSize: 12,
              color: isOverdue(ticket) ? "var(--alarm-strong)" : "var(--text-mut)",
              fontWeight: isOverdue(ticket) ? 700 : 400,
            }}>
              {dueLabel(ticket)} · SLA {SLA_HOURS[ticket.priority]}h
            </span>
          )}
        </div>

        {!editing && ticket.description && (
          <p style={{
            fontSize: 14, lineHeight: 1.55, color: "var(--text)", background: "var(--well)",
            padding: "12px 14px", borderRadius: 8, whiteSpace: "pre-wrap", margin: "0 0 16px",
          }}>
            {ticket.description}
          </p>
        )}

        {/* triage controls */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 4 }}>
          <Field label="Status">
            <select style={inputStyle} value={ticket.status} onChange={(e) => onUpdate(ticket.id, { status: e.target.value })}>
              {STATUSES.map((s) => <option key={s}>{s}</option>)}
            </select>
          </Field>
          <Field label="Technician">
            <select style={inputStyle} value={ticket.assignee} onChange={(e) => onUpdate(ticket.id, { assignee: e.target.value })}>
              {assigneeOptions.map((t) => <option key={t}>{t}</option>)}
            </select>
          </Field>
          <Field label="Priority">
            <select style={inputStyle} value={ticket.priority} onChange={(e) => onUpdate(ticket.id, { priority: e.target.value })}>
              {PRIORITIES.map((p) => <option key={p}>{p}</option>)}
            </select>
          </Field>
          <Field label="Request type">
            <select
              style={{
                ...inputStyle,
                borderLeft: REQUEST_TYPE_EDGE[ticket.requestType]
                  ? "3px solid " + REQUEST_TYPE_EDGE[ticket.requestType]
                  : inputStyle.border,
              }}
              value={ticket.requestType || "Incident"}
              onChange={(e) => onUpdate(ticket.id, { request_type: e.target.value })}
            >
              {REQUEST_TYPES.map((r) => <option key={r}>{r}</option>)}
            </select>
          </Field>
          <Field label="Category">
            <select
              style={inputStyle}
              value={ticket.category}
              onChange={(e) => onUpdate(ticket.id, { category: e.target.value, sub_category: "" })}
            >
              {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Sub category">
            <select
              style={inputStyle}
              value={ticket.subCategory || ""}
              onChange={(e) => onUpdate(ticket.id, { sub_category: e.target.value })}
            >
              <option value="">—</option>
              {subCatOptions.map((s) => <option key={s}>{s}</option>)}
            </select>
          </Field>
        </div>

        {ticket.status !== "Resolved" ? (
          <button
            onClick={() => onUpdate(ticket.id, { status: "Resolved" })}
            style={{
              background: "#0E7C66", color: "#fff", border: "none", borderRadius: 6,
              padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer",
            }}
          >
            Mark resolved
          </button>
        ) : (
          <button
            onClick={() => onUpdate(ticket.id, { status: "Open" })}
            style={{
              background: "var(--card)", color: "#0E7C66", border: "1px solid #0E7C66", borderRadius: 6,
              padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer",
            }}
          >
            Reopen ticket
          </button>
        )}
      </div>

      {/* AI assist */}
      {(triage || triageError) && (
        <TriageResults triage={triage} error={triageError} ticket={ticket} onUpdate={onUpdate} />
      )}

      <RepliesPanel ticket={ticket} onUpdate={onUpdate} />

      {/* work notes */}
      <div style={{ background: "var(--card)", border: "1px solid var(--card-border)", borderRadius: 10, padding: "18px 22px", marginTop: 14 }}>
        <div style={{ fontFamily: mono, fontSize: 11, letterSpacing: 0.8, color: "var(--text-mut)", textTransform: "uppercase", marginBottom: 12 }}>
          Work notes ({ticket.notes.length})
        </div>

        {ticket.notes.length === 0 && (
          <div style={{ fontSize: 13, color: "var(--text-faint)", marginBottom: 12 }}>
            No notes yet. Add the first update below.
          </div>
        )}

        {ticket.notes.map((n, i) => (
          <div key={i} style={{ borderLeft: n.system ? "2px dashed var(--border-soft)" : "2px solid var(--card-border)", padding: "4px 0 4px 12px", marginBottom: 10 }}>
            <div style={{
              fontSize: n.system ? 12.5 : 13.5,
              color: n.system ? "var(--text-mut)" : "var(--text)",
              fontStyle: n.system ? "italic" : "normal",
              whiteSpace: "pre-wrap",
            }}>{n.text}</div>
            <div style={{ fontFamily: mono, fontSize: 11, color: "var(--text-faint)", marginTop: 3 }}>{fmtDate(n.at)}{n.system ? " · auto" : ""}</div>
          </div>
        ))}

        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <input
            style={{ ...inputStyle, flex: 1 }}
            placeholder="Add a work note…"
            value={note}
            onChange={(e) => setNote(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") addNote(); }}
          />
          <button onClick={addNote} style={{
            background: "var(--ink-btn)", color: "#fff", border: "none", borderRadius: 6,
            padding: "9px 16px", fontSize: 13, cursor: "pointer",
          }}>
            Add note
          </button>
        </div>
      </div>

      {/* delete */}
      <div style={{ marginTop: 14, textAlign: "right" }}>
        {confirmDelete ? (
          <span style={{ fontSize: 13 }}>
            Delete {ticket.key} permanently?{" "}
            <button onClick={() => onDelete(ticket.id)} style={{ background: "#C0392B", color: "#fff", border: "none", borderRadius: 6, padding: "7px 12px", fontSize: 12, cursor: "pointer", marginLeft: 6 }}>
              Delete
            </button>
            <button onClick={() => setConfirmDelete(false)} style={{ background: "var(--card)", color: "var(--text-soft)", border: "1px solid var(--input-border)", borderRadius: 6, padding: "7px 12px", fontSize: 12, cursor: "pointer", marginLeft: 6 }}>
              Keep
            </button>
          </span>
        ) : (
          <button onClick={() => setConfirmDelete(true)} style={{ background: "transparent", color: "var(--text-faint)", border: "none", fontSize: 12, cursor: "pointer", textDecoration: "underline" }}>
            Delete ticket
          </button>
        )}
      </div>
    </div>
  );
}

// ---------- AI assist panel ----------

    background: "var(--card)",
    color: "#0E7C66",
    border: "1px solid #0E7C66",
    borderRadius: 6,
    padding: "5px 10px",
    fontSize: 12,
    fontWeight: 600,
    cursor: "pointer",
  };

  return (
    <div style={{
      background: "var(--card)", border: "1px solid var(--card-border)", borderRadius: 10,
      padding: "16px 22px", marginTop: 14,
    }}>
      <div style={{
        fontFamily: mono, fontSize: 11, letterSpacing: 0.8, color: "var(--text-mut)",

      }}>
        AI triage
      </div>

      {error && (
        <div style={{ fontSize: 13, color: "#C0392B" }}>{error}</div>

              Suggested priority: <strong>{triage.priority}</strong>{" "}
              {triage.priority !== ticket.priority && PRIORITIES.includes(triage.priority) && (

                  onClick={() => onUpdate(ticket.id, { priority: triage.priority })}
                >
                  Apply
                </button>
              )}
            </span>
          </div>
          {triage.reasoning && (
            <div style={{ fontSize: 12.5, color: "var(--text-mut)", marginBottom: 10 }}>{triage.reasoning}</div>
          )}

            <div>
              <div style={{
                fontFamily: mono, fontSize: 10, letterSpacing: 0.8, color: "var(--text-mut)",

              }}>

              <div style={{ fontSize: 13.5, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>

              <button

  const [reply, setReply] = useState("");

  // Future: when outbound email is connected, this panel will render the
  // requester conversation (ticket.replies) and "Send reply" will POST to
  // /api/tickets/:id/replies, which sends the email and stores the message.
  const replies = ticket.replies || [];

  return (
    <div style={{
      background: "var(--card)", border: "1px solid var(--card-border)", borderRadius: 10,
      padding: "18px 22px", marginTop: 14,
    }}>
      <div style={{
        fontFamily: mono, fontSize: 11, letterSpacing: 0.8, color: "var(--text-mut)",
        textTransform: "uppercase", marginBottom: 12,
      }}>
        Replies ({replies.length})

      {replies.length === 0 ? (
        <div style={{
          fontSize: 13, color: "var(--text-mut)", background: "var(--well)",
          borderRadius: 8, padding: "12px 14px", marginBottom: 12,
        }}>
          No replies yet. Once outbound email is connected, the back-and-forth
          conversation with the requester will appear here.
        </div>
      ) : (
        <div style={{ marginBottom: 12 }}>
          {replies.map((r, i) => (
            <div key={i} style={{
              background: "var(--well)", borderRadius: 8, padding: "10px 14px", marginBottom: 8,
              borderLeft: "3px solid " + (r.direction === "outbound" ? "#0E7C66" : "var(--input-border)"),
            }}>
              <div style={{ fontFamily: mono, fontSize: 11, color: "var(--text-mut)", marginBottom: 4 }}>
                {r.direction === "outbound" ? "→ to requester" : "← from requester"} · {fmtDate(r.at)}
              </div>
              <div style={{ fontSize: 13.5, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{r.text}</div>
            </div>
          ))}
        </div>
      )}

      <textarea
        placeholder="Write a reply to the requester…"
        value={reply}
        onChange={(e) => setReply(e.target.value)}
        style={{ ...inputStyle, minHeight: 80, resize: "vertical" }}
      />
      <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
        <button disabled title="Requires the outbound email integration" style={{
          background: "var(--well)", color: "var(--text-faint)", border: "1px dashed var(--border-soft)",
          borderRadius: 6, padding: "8px 14px", fontSize: 13, fontWeight: 600, cursor: "default",
        }}>
          Send reply — email integration pending
        </button>
        <button
          onClick={() => {
            if (!reply.trim()) return;
            onUpdate(ticket.id, {}, "Draft reply to requester:\n" + reply.trim());
            setReply("");
          }}
          style={{
            background: "var(--card)", color: "#0E7C66", border: "1px solid #0E7C66",
            borderRadius: 6, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer",
          }}
        >
          Save draft to work notes
        </button>
      </div>
    </div>
  );
}

                  onClick={() => setPendingRemove(null)}
                  style={{ background: "var(--card)", color: "var(--text-soft)", border: "1px solid var(--input-border)", borderRadius: 6, padding: "6px 10px", fontSize: 12, cursor: "pointer" }}
                >
                  Keep
                </button>
              </span>
            ) : (
              <button
                onClick={() => setPendingRemove(tech)}
                style={{ background: "transparent", color: "var(--text-faint)", border: "none", fontSize: 12, cursor: "pointer", textDecoration: "underline" }}
              >
                Remove
              </button>

        ))}

        <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
          <input
            style={{ ...inputStyle, flex: 1 }}
            placeholder="New engineer's name…"
            value={name}
            onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
          />
          <button
            onClick={submit}
            style={{
              background: "#0E7C66", color: "#fff", border: "none", borderRadius: 6,
              padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer",
            }}
          >
            Add engineer
          </button>
        </div>

        <div style={{ fontSize: 12, color: "var(--text-faint)", marginTop: 12 }}>
          Removing an engineer doesn't touch their existing tickets — those keep the name until you reassign them.
        </div>
      </div>
    </div>
  );
}

// ---------- reports view ----------
function ReportsView({ tickets, technicians }) {
  const stats = useMemo(() => {
    const total = tickets.length;
    const resolved = tickets.filter((t) => t.status === "Resolved");
    const active = total - resolved.length;

    let avgResolutionMs = null;
    if (resolved.length) {
      const sum = resolved.reduce((acc, t) => {
        const end = new Date(t.resolvedAt || t.updatedAt).getTime();
        return acc + Math.max(0, end - new Date(t.createdAt).getTime());
      }, 0);
      avgResolutionMs = sum / resolved.length;
    }

    const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
    const resolvedLast7 = resolved.filter(
      (t) => new Date(t.resolvedAt || t.updatedAt).getTime() >= weekAgo
    ).length;

    const countBy = (fn) => {
      const m = {};
      tickets.forEach((t) => { const k = fn(t); m[k] = (m[k] || 0) + 1; });
      return m;
    };

    const byCategory = countBy((t) => t.category);
    const byPriority = countBy((t) => t.priority);

    const byTech = {};
    ["Unassigned", ...technicians].forEach((tech) => {
      const mine = tickets.filter((t) => t.assignee === tech);
      if (mine.length) {
        byTech[tech] = {
          active: mine.filter((t) => t.status !== "Resolved").length,
          resolved: mine.filter((t) => t.status === "Resolved").length,
        };
      }
    });
    tickets.forEach((t) => {
      if (!(t.assignee in byTech)) {
        byTech[t.assignee] = {
          active: tickets.filter((x) => x.assignee === t.assignee && x.status !== "Resolved").length,
          resolved: tickets.filter((x) => x.assignee === t.assignee && x.status === "Resolved").length,
        };
      }
    });

    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - i);
      const next = new Date(d);
      next.setDate(d.getDate() + 1);
      days.push({
        label: d.toLocaleDateString(undefined, { month: "numeric", day: "numeric" }),
        count: tickets.filter((t) => {
          const c = new Date(t.createdAt).getTime();
          return c >= d.getTime() && c < next.getTime();
        }).length,
      });
    }

    return { total, active, resolvedCount: resolved.length, avgResolutionMs, resolvedLast7, byCategory, byPriority, byTech, days };
  }, [tickets, technicians]);

  function fmtDuration(ms) {
    if (ms == null) return "—";
    const h = ms / 3600000;
    if (h < 1) return Math.max(1, Math.round(ms / 60000)) + "m";
    if (h < 48) return h.toFixed(1) + "h";
    return (h / 24).toFixed(1) + "d";
  }

  function exportCsv() {
    const esc = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const header = ["Key", "Subject", "Requester", "Category", "Priority", "Status", "Assignee", "Created", "Resolved", "LastUpdated", "NotesCount"];
    const rows = tickets.map((t) =>
      [t.key, t.subject, t.requester, t.category, t.priority, t.status, t.assignee, t.createdAt, t.resolvedAt || "", t.updatedAt, t.notes.length]
        .map(esc).join(",")
    );
    const blob = new Blob([header.map(esc).join(",") + "\n" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "helpdesk-tickets.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  const card = { background: "var(--card)", border: "1px solid var(--card-border)", borderRadius: 10, padding: "18px 22px", marginBottom: 14 };
  const sectionLabel = {
    fontFamily: mono, fontSize: 11, letterSpacing: 0.8, color: "var(--text-mut)",
    textTransform: "uppercase", marginBottom: 12,
  };

  function BarRow({ label, count, max, color }) {
    const pct = max ? Math.max(4, Math.round((count / max) * 100)) : 0;
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7 }}>
        <span style={{ width: 130, fontSize: 12.5, color: "var(--text-soft)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{label}</span>
        <div style={{ flex: 1, background: "var(--track)", borderRadius: 4, height: 14 }}>
          <div style={{ width: pct + "%", height: "100%", background: color, borderRadius: 4 }} />
        </div>
        <span style={{ fontFamily: mono, fontSize: 12, color: "var(--text)", width: 28, textAlign: "right" }}>{count}</span>
      </div>
    );
  }

  if (tickets.length === 0) {
    return (
      <div style={{ ...card, textAlign: "center", padding: "48px 20px" }}>
        <div style={{ fontFamily: mono, fontSize: 14, color: "var(--text-soft)", marginBottom: 8 }}>No data to report yet</div>
        <div style={{ fontSize: 13, color: "var(--text-mut)" }}>Reports will populate as tickets are logged and resolved.</div>
      </div>
    );
  }

  const maxCat = Math.max(...Object.values(stats.byCategory));
  const maxPri = Math.max(...Object.values(stats.byPriority));
  const maxDay = Math.max(1, ...stats.days.map((d) => d.count));
  const maxTech = Math.max(...Object.values(stats.byTech).map((v) => v.active + v.resolved));

  const kpi = (label, value, sub) => (
    <div key={label} style={{ flex: 1, minWidth: 120, background: "var(--card)", border: "1px solid var(--card-border)", borderRadius: 10, padding: "14px 16px" }}>
      <div style={{ fontFamily: mono, fontSize: 24, fontWeight: 700, color: "var(--text)" }}>{value}</div>
      <div style={{ fontFamily: mono, fontSize: 10, letterSpacing: 0.8, color: "var(--text-mut)", textTransform: "uppercase", marginTop: 2 }}>{label}</div>
      {sub && <div style={{ fontSize: 11.5, color: "var(--text-faint)", marginTop: 4 }}>{sub}</div>}
    </div>
  );

  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
        <span style={{ fontFamily: mono, fontSize: 13, letterSpacing: 1, fontWeight: 700 }}>REPORTS</span>
        <button onClick={exportCsv} style={{
          background: "var(--ink-btn)", color: "#fff", border: "none", borderRadius: 6,
          padding: "8px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer",
        }}>
          Export CSV
        </button>
      </div>

      {/* KPIs */}
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        {kpi("Total tickets", stats.total)}
        {kpi("Active", stats.active)}
        {kpi("Resolved", stats.resolvedCount, stats.resolvedLast7 + " in last 7 days")}
        {kpi("Avg resolution", fmtDuration(stats.avgResolutionMs), "open → resolved")}
      </div>

      {/* trend */}
      <div style={card}>
        <div style={sectionLabel}>Tickets created — last 14 days</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 90 }}>
          {stats.days.map((d, i) => (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <span style={{ fontFamily: mono, fontSize: 10, color: d.count ? "var(--text-soft)" : "var(--border-soft)" }}>{d.count || ""}</span>
              <div style={{
                width: "100%", maxWidth: 26, borderRadius: "3px 3px 0 0",
                height: Math.max(3, Math.round((d.count / maxDay) * 60)),
                background: d.count ? "#0E7C66" : "var(--track)",
              }} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
          <span style={{ fontFamily: mono, fontSize: 10, color: "var(--text-faint)" }}>{stats.days[0].label}</span>
          <span style={{ fontFamily: mono, fontSize: 10, color: "var(--text-faint)" }}>{stats.days[13].label}</span>
        </div>
      </div>

      {/* breakdowns */}
      <div style={card}>
        <div style={sectionLabel}>By category</div>
        {Object.entries(stats.byCategory).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
          <BarRow key={k} label={k} count={v} max={maxCat} color="#0E7C66" />
        ))}
      </div>

      <div style={card}>
        <div style={sectionLabel}>By priority</div>
        {PRIORITIES.filter((p) => stats.byPriority[p]).map((p) => (
          <BarRow key={p} label={p} count={stats.byPriority[p]} max={maxPri} color={PRIORITY_COLOR[p]} />
        ))}
      </div>

      <div style={card}>
        <div style={sectionLabel}>Workload by engineer</div>
        {Object.entries(stats.byTech).sort((a, b) => (b[1].active + b[1].resolved) - (a[1].active + a[1].resolved)).map(([tech, v]) => (
          <div key={tech} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7 }}>
            <span style={{ width: 130, fontSize: 12.5, color: "var(--text-soft)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{tech}</span>
            <div style={{ flex: 1, display: "flex", background: "var(--track)", borderRadius: 4, height: 14, overflow: "hidden" }}>
              <div style={{ width: maxTech ? ((v.active / maxTech) * 100) + "%" : 0, background: "#E67E22", height: "100%" }} />
              <div style={{ width: maxTech ? ((v.resolved / maxTech) * 100) + "%" : 0, background: "#0E7C66", height: "100%" }} />
            </div>
            <span style={{ fontFamily: mono, fontSize: 12, color: "var(--text)", width: 70, textAlign: "right" }}>
              {v.active} / {v.resolved}
            </span>
          </div>
        ))}
        <div style={{ fontSize: 11.5, color: "var(--text-faint)", marginTop: 8 }}>
          <span style={{ color: "#E67E22" }}>■</span> active&nbsp;&nbsp;
          <span style={{ color: "#0E7C66" }}>■</span> resolved&nbsp;&nbsp;(counts shown as active / resolved)
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HelpdeskApp />);
</script>
</body>
</html>
